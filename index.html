<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 響應式輪播與卡片</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      
        .carousel-item img {
            height: 450px;
            object-fit: cover;
            object-position: center;
        }

        
        .card-img-top {
            height: 180px;
            object-fit: cover;
        }

       
        @media (min-width: 1280px) {
            .col-custom-6 {
                flex: 0 0 auto;
                width: 16.666667%;
            }
        }
    </style>
</head>
<body class="bg-light">

    <div class="container my-4">
        
        
        <div id="artCarousel" class="carousel slide mb-5 shadow rounded overflow-hidden" data-bs-ride="carousel">
          
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#artCarousel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#artCarousel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#artCarousel" data-bs-slide-to="2"></button>
                <button type="button" data-bs-target="#artCarousel" data-bs-slide-to="3"></button>
            </div>

            
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="1.jpg" class="d-block w-100" alt="星夜">
                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
                        <h5>星夜 (The Starry Night, 1889)</h5>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="2.jpg" class="d-block w-100" alt="自畫像">
                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
                        <h5>自畫像 (Self-Portrait, 1889)</h5>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="3.jpg" class="d-block w-100" alt="盛開的杏花">
                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
                        <h5>盛開的杏花 (Almond Blossoms, 1890)</h5>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="4.jpg" class="d-block w-100" alt="向日葵">
                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
                        <h5>向日葵 (Sunflowers, 1888)</h5>
                    </div>
                </div>
            </div>

        
            <button class="carousel-control-prev" type="button" data-bs-target="#artCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">上一張</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#artCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">下一張</span>
            </button>
        </div>


        <div class="row g-3" id="card-container">
           
        </div>

    </div>

    <
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    

    <script>
        const artworks = [
            { title: "絲柏樹與麥田", desc: "Wheat Field with Cypresses (1889)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Wheat-Field-with-Cypresses-%281889%29-Vincent-van-Gogh-Met.jpg/800px-Wheat-Field-with-Cypresses-%281889%29-Vincent-van-Gogh-Met.jpg" },
            { title: "夜間咖啡館", desc: "Café Terrace at Night (1888)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Vincent_Willem_van_Gogh_-_Cafe_Terrace_at_Night_%28Yorck%29.jpg/800px-Vincent_Willem_van_Gogh_-_Cafe_Terrace_at_Night_%28Yorck%29.jpg" },
            { title: "在亞爾的臥室", desc: "Bedroom in Arles (1888)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/Vincent_van_Gogh_-_De_slaapkamer_-_Google_Art_Project.jpg/800px-Vincent_van_Gogh_-_De_slaapkamer_-_Google_Art_Project.jpg" },
            { title: "鳶尾花", desc: "Irises (1889)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Irises-Vincent_van_Gogh.jpg/800px-Irises-Vincent_van_Gogh.jpg" },
            { title: "隆河上的星夜", desc: "Starry Night Over the Rhône (1888)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Starry_Night_Over_the_Rhone.jpg/800px-Starry_Night_Over_the_Rhone.jpg" },
            { title: "麥田群鴉", desc: "Wheatfield with Crows (1890)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Vincent_van_Gogh_-_Wheatfield_with_Crows_-_Google_Art_Project.jpg/800px-Vincent_van_Gogh_-_Wheatfield_with_Crows_-_Google_Art_Project.jpg" },
            { title: "嘉舍醫師的畫像", desc: "Portrait of Dr. Gachet (1890)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Portrait_of_Dr._Gachet.jpg/800px-Portrait_of_Dr._Gachet.jpg" },
            { title: "吃馬鈴薯的人", desc: "The Potato Eaters (1885)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Van-willem-vincent-gogh-die-kartoffelesser-03850.jpg/800px-Van-willem-vincent-gogh-die-kartoffelesser-03850.jpg" },
            { title: "紅葡萄園", desc: "The Red Vineyard (1888)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Red_vineyards.jpg/800px-Red_vineyards.jpg" },
            { title: "奧維爾教堂", desc: "The Church at Auvers (1890)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/Vincent_van_Gogh_-_The_Church_in_Auvers-sur-Oise%2C_View_from_the_Chevet_-_Google_Art_Project.jpg/800px-Vincent_van_Gogh_-_The_Church_in_Auvers-sur-Oise%2C_View_from_the_Chevet_-_Google_Art_Project.jpg" },
            { title: "盛開的桃花", desc: "Souvenir de Mauve (1888)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Vincent_van_Gogh_-_Peach_Tree_in_Blossom_-_Google_Art_Project.jpg/800px-Vincent_van_Gogh_-_Peach_Tree_in_Blossom_-_Google_Art_Project.jpg" },
            { title: "橄欖樹林", desc: "Olive Trees (1889)", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Vincent_van_Gogh_-_Olive_Trees_-_Google_Art_Project.jpg/800px-Vincent_van_Gogh_-_Olive_Trees_-_Google_Art_Project.jpg" }
        ];

        const container = document.getElementById('card-container');
        
        artworks.forEach(art => {
            container.innerHTML += `
                <div class="col-12 col-sm-6 col-md-3 col-custom-6">
                    <div class="card h-100 shadow-sm">
                        <img src="${art.img}" class="card-img-top" alt="${art.title}">
                        <div class="card-body">
                            <h6 class="card-title fw-bold">${art.title}</h6>
                            <p class="card-text text-muted small">${art.desc}</p>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
